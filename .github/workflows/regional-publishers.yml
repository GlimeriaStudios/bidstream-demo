name: Refresh additional procurement publishers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - regional-sources/refresh-publisher.py
      - .github/workflows/regional-publishers.yml
  schedule:
    - cron: '47 2 * * *'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: [burundi-armp, ethiopia-eep, ethiopia-eeu, malawi-ppda, seychelles-ntb, south-sudan-ppdaa, zambia-zppa, igad-opportunities, comesa-consultancies, trademark-africa, boamp-indian-ocean]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.1.3
      - run: python regional-sources/refresh-publisher.py "${{ matrix.source }}"
      - uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.source }}
          path: regional-sources/${{ matrix.source }}.json
          retention-days: 1
  publish:
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: regional-publisher-snapshots
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: refreshed
          merge-multiple: true
      - name: Publish successful updates and retain the last usable snapshot for other sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(refreshed/*.json)
          (( ${#files[@]} > 0 ))
          python - <<'PY'
          import json, pathlib
          from datetime import datetime
          for src in pathlib.Path('refreshed').glob('*.json'):
              dest = pathlib.Path('regional-sources') / src.name
              new = json.loads(src.read_text())['checkedAt']
              old = json.loads(dest.read_text())['checkedAt'] if dest.exists() else None
              if old is None or datetime.fromisoformat(new) > datetime.fromisoformat(old):
                  dest.write_bytes(src.read_bytes())
          PY
          git add -- regional-sources/*.json
          if ! git diff --cached --quiet; then
            git -c user.name="BidStream feed" -c user.email="actions@users.noreply.github.com" commit -m "Refresh regional publisher snapshots"
            git pull --rebase
            git push
          fi
